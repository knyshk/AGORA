name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests, migrations, signed manifests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agora
          POSTGRES_PASSWORD: agora
          POSTGRES_DB: agora
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U agora" --health-interval 5s --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
      TEST_REDIS_URL: redis://localhost:6379/15
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      FALLBACK_CHAIN: groq,gemini,openrouter
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Unit and integration tests (no network, no real LLM calls)
        run: pytest -q -p no:warnings
      - name: Migrations build the schema on a fresh Postgres and match the models
        env:
          DATABASE_URL: postgresql+psycopg2://agora:agora@localhost:5432/agora
        run: alembic upgrade head && alembic check
      - name: Every committed agent manifest has a valid Ed25519 signature
        run: python -c "from registry.registry import REGISTRY, REJECTED; assert not REJECTED, REJECTED; assert len(REGISTRY) == 8; print('8 manifests verified')"

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx oxlint src   # errors fail the build; warnings are reported
      - run: npm run build

  e2e:
    name: Browser tests (Playwright, API mocked)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
